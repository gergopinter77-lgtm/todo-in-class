<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo-in-class</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="container">
      <h1>Todo App</h1>
      <button type="button" id="dark-mode-toggle">Dark Mode</button>
      <form class="todo-form">
        <input type="text" placeholder="Add a new todo" id="todo-input">
        <input type="date" id="due-date" aria-label="Due date">
        <button type="submit">Add</button>
      </form>
      <p id="error-message">Please enter a todo item</p>

      <button type="button" id="sort-status">Sort by status</button>

      <ul class="todo-list" id="todo-list">

      </ul>

      <button type="button" id="clear-all">Clear all</button>

      <button type="button" id="export-todos">Export JSON</button>
      <button type="button" id="export-pdf">Export PDF</button>
      <button type="button" id="import-todos">Import JSON</button>
      <!-- opened by the Import JSON button -->
      <input type="file" id="import-file" accept=".json,application/json" hidden>

      <div class="color-picker">
        <label for="color">Background color</label>
        <input type="color" id="color" value="#f4f4f4">
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
